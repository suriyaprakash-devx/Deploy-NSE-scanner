services:
  - type: web
    name: nse-semi-algo-scanner
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nse-scanner-postgres
          property: connectionString
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: DEFAULT_TIMEFRAME
        value: 5M
      - key: SCAN_UNIVERSE
        value: ALL_NSE
      - key: SCAN_INTERVAL_SECONDS
        value: 30
      - key: MAX_REQUESTS_PER_SECOND
        value: 20
      - key: MAX_CONCURRENT_REQUESTS
        value: 12
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: nse-scanner-postgres
    plan: standard
    databaseName: nse_scanner
    user: scanner_user
